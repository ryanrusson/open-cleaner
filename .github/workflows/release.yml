name: Release

# Publishes a GitHub Release with the installer attached whenever main has an
# app version (src-tauri/tauri.conf.json) that has not been released yet.
# To cut a release: bump the version and merge to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: version
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has not been released; publishing."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p driver-core
      - name: Smoke test the scanner
        run: cargo run -p driver-core --bin driver-scan > scan.json
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Driver Updater ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: target/release/bundle/nsis/*.exe
          body: |
            Download the `.exe` below and run it to install Driver Updater.

            The installer is not code-signed yet, so Windows SmartScreen will warn the first time: choose **More info → Run anyway**.
