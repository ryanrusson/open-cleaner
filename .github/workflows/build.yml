name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p driver-core -p system-tools
      # Real scan on a real Windows machine; fails if the inventory breaks.
      - name: Smoke test the scanner
        run: cargo run -p driver-core --bin driver-scan > scan.json
      # Read-only run of the cleaner, startup, apps and disk scans.
      - name: Smoke test the tools
        run: cargo run -p system-tools --bin tools-scan > tools.json
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: opencleaner-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
