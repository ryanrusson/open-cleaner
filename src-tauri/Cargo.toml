[package]
name = "opencleaner"
version = "0.5.1"
edition = "2021"
license-file = "../LICENSE"
description = "PC maintenance for Windows: driver and app updates, junk cleaning, startup, duplicates, disk usage"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
driver-core = { path = "../crates/driver-core" }
system-tools = { path = "../crates/system-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
