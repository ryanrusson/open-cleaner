[package]
name = "windows-driver-updater"
version = "0.4.0"
edition = "2021"
description = "Scans installed Windows drivers and reports which updates are available"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
driver-core = { path = "../crates/driver-core" }
system-tools = { path = "../crates/system-tools" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
