[package]
name = "system-tools"
version = "0.5.1"
edition = "2021"
description = "PC maintenance tools: junk cleaner, startup manager, installed apps, disk usage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell"] }
