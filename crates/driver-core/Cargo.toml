[package]
name = "driver-core"
version = "0.1.0"
edition = "2021"
description = "Driver inventory and update detection for Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
] }
